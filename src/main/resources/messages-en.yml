prefix: '&6[&eFTop&6] '
calculation:
  starting: '%prefix%&7Calculating factions...'
  finished: '%prefix%&aRecalculation finished in &f%duration%s'
command:
  ftop:
    line: '&6%rank%. &b%faction_name% &a$%value%'
    header: '&4&l&m-----&e&lPage &c&l%page%&4&l&m-----'
    delay: '%prefix%&cWait %seconds%s before using /ftop again'
  worth:
    self: '&aYour faction is worth &6$%value%'
